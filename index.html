<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tile Flip</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Tile Flip</h1>

    <div class="modes" role="radiogroup" aria-label="Mode">
      <button type="button" data-mode="setup" role="radio">Setup</button>
      <button type="button" data-mode="play" role="radio">Play</button>
    </div>

    <p id="hint"></p>

    <div class="layout">
      <section class="board">
        <div id="grid" class="grid"></div>

        <p id="status" aria-live="polite"></p>

        <div class="steps">
          <button type="button" id="first">« Start</button>
          <button type="button" id="prev">‹ Prev</button>
          <button type="button" id="next">Next ›</button>
          <button type="button" id="last">End »</button>
        </div>

        <button type="button" id="clear">Clear all</button>
      </section>

      <aside class="panel">
        <section>
          <h2>History</h2>
          <ol id="history" class="list"></ol>
        </section>

        <section>
          <div class="panel-head">
            <h2>Saved</h2>
            <button type="button" id="save">Save sequence</button>
          </div>
          <ul id="saves" class="list"></ul>
          <p id="saves-empty" class="empty">No saved sequences yet.</p>
        </section>
      </aside>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
